# This rule is not used by the project kubeshark-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kubeshark.opstreelabs.in.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeshark-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubeshark-admin-role
rules:
- apiGroups:
  - kubeshark.opstreelabs.in
  resources:
  - kubesharks
  verbs:
  - '*'
- apiGroups:
  - kubeshark.opstreelabs.in
  resources:
  - kubesharks/status
  verbs:
  - get
