# permissions for end users to edit kubesharks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: kubeshark-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: kubeshark-operator
    app.kubernetes.io/part-of: kubeshark-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubeshark-editor-role
rules:
- apiGroups:
  - kubeshark.opstreelabs.in
  resources:
  - kubesharks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubeshark.opstreelabs.in
  resources:
  - kubesharks/status
  verbs:
  - get
